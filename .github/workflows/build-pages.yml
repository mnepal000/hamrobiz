name: Build pages

# Regenerates the static business/category/city/section pages from
# data/*.json whenever listing data changes, so editing listings.json
# (even from the GitHub web editor) keeps every page in sync.
on:
  push:
    paths:
      - "data/listings.json"
      - "data/jobs.json"
      - "data/housing.json"
      - "data/events.json"
      - "tools/generate_pages.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node tools/generate_pages.js
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add business category city jobs housing events advertise about sitemap.xml data/slugs.json
          if git diff --cached --quiet; then
            echo "No page changes."
          else
            git commit -m "Auto-generate pages from data"
            git push
          fi
